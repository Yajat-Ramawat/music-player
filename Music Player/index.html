<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="music.ico" type="image/x.ico">
</head>
<body>

    <main class="player">

        <div class="album-art">
            <img id="albumArt" src="https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=600" alt="Album Art">
        </div>

        <div class="song-info">
            <h1 id="songTitle">Dreamer</h1>
            <p id="artistName">Alan Walker</p>
        </div>

        <div class="progress-container">
            <span id="currentTime">0:00</span>

            <input
                type="range"
                id="progressBar"
                min="0"
                max="100"
                value="0"
            >

            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="prevBtn" title="Previous">⏮</button>
            <button id="playBtn" class="play-btn" title="Play">▶</button>
            <button id="nextBtn" title="Next">⏭</button>
        </div>

        <div class="volume-container">
            <span>🔊</span>

            <input
                type="range"
                id="volumeBar"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >
        </div>

        <div class="playlist">
            <h2>Playlist</h2>

            <div id="playlistItems"></div>
        </div>

        <audio id="audio"></audio>

    </main>

    <script src="script.js"></script>
</body>
</html>
